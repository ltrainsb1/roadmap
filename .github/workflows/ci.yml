name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit-and-api:
    runs-on: ubuntu-latest # Docker is available here, which Testcontainers needs
    env:
      TEST_MONGO: container
      TEST_S3: container
      TEST_CLAMAV: container
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --coverage

  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  e2e:
    runs-on: ubuntu-latest # Docker is available here, which Testcontainers needs
    env:
      TEST_MONGO: container
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roadmap/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy-smoke:
    runs-on: ubuntu-latest # Docker is available here; ports 80 and 443 are free
    env:
      # The smoke file adds MinIO in place of S3 and keeps MongoDB's data in a named volume.
      COMPOSE: docker compose -f deploy/poc/docker-compose.yml -f deploy/poc/docker-compose.smoke.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Write a throwaway .env
        run: |
          mongo_password=$(openssl rand -hex 16)
          {
            echo "DOMAIN=localhost"
            echo "APP_ORIGIN=https://localhost"
            echo "MONGO_INITDB_ROOT_USERNAME=root"
            echo "MONGO_INITDB_ROOT_PASSWORD=${mongo_password}"
            echo "MONGO_URI=mongodb://root:${mongo_password}@mongo:27017/?replicaSet=rs0&authSource=admin"
            echo "MONGO_DB=roadmap"
            echo "NODE_ENV=production"
            echo "PORT=3000"
            echo "TOTP_ENC_KEY=$(openssl rand -base64 32)"
            echo "MAILER=file"
            echo "MAIL_OUTBOX_FILE=/tmp/outbox.jsonl"
            echo "MAIL_FROM=no-reply@localhost"
            echo "HIBP_ENABLED=false"
            echo "AUTH_RATE_LIMIT_PER_MIN=10"
            echo "S3_BUCKET=roadmap-files"
            echo "MINIO_ROOT_USER=smoke-$(openssl rand -hex 8)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "MINIO_KMS_SECRET_KEY=smoke-key:$(openssl rand -base64 32)"
          } > deploy/poc/.env
      - name: Build both images
        run: $COMPOSE build
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roadmap-api:poc
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roadmap-caddy:poc
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      # ClamAV runs in production but is built upstream, not by us: its findings are listed here, and a fix means
      # an upstream rebuild or a newer tag (see the follow-ups document). MinIO is not scanned: it runs only in this job, never in a deployment.
      - name: List ClamAV image findings (upstream image, not a gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clamav/clamav:1.4.7
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Start the stack
        # ClamAV loads its signatures before it is healthy, and the API waits for it.
        run: $COMPOSE up -d --wait --wait-timeout 420
      - name: Bootstrap prints a setup link
        id: bootstrap
        run: |
          url=$($COMPOSE exec -T api node dist/cli/bootstrap.js --tenant Test --email you@example.com --name You)
          echo "$url" | grep -Eq '^https://localhost/reset/[A-Za-z0-9_-]+$'
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          # A throwaway stack, so the writing checks run: the script signs in with the setup link to check uploads,
          # downloads and the virus scan.
          SMOKE_WRITES: 'yes'
          SMOKE_SETUP_URL: ${{ steps.bootstrap.outputs.url }}
          SMOKE_CONNECT_TO: minio:9000:127.0.0.1:9000
        run: scripts/smoke.sh https://localhost
      - name: Show the stack logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 100
      - name: Tear the stack down
        if: always()
        run: $COMPOSE down -v
