name: Deploy POC

# Manual only: nothing deploys on a merge. Run it from the Actions tab, or with
#   gh workflow run deploy-poc.yml --ref <branch>
# The AWS settings are repository variables (the runbook, deploy/poc/README.md, sets them from `terraform output`).
# AWS credentials come from GitHub's OIDC provider: no key is stored anywhere.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Two deploys at once would fight over one server. A second run waits for the first.
concurrency:
  group: deploy-poc
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04-arm # the server is arm64, so the images are built natively and need no emulation
    environment: poc # the deploy role trusts this environment and nothing else
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: pdf
            context: .
            file: apps/pdf/Dockerfile
          - name: caddy
            context: .
            file: deploy/poc/caddy.Dockerfile
          - name: clamav
            context: deploy/poc
            file: deploy/poc/clamav.Dockerfile
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      REGISTRY: ${{ vars.POC_REGISTRY }}
      IMAGE: roadmap-${{ matrix.name }}
      DOCKERFILE: ${{ matrix.file }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.POC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Is this commit's image already in the registry?
        # Tags are immutable, so a second run of the same commit cannot push again. It skips the build and the push.
        id: exists
        run: |
          if out=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids "imageTag=$GITHUB_SHA" 2>&1); then
            echo "$IMAGE:$GITHUB_SHA is already there, so it is not built or pushed again."
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<< "$out"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi
      - name: Build for linux/arm64
        if: steps.exists.outputs.found == 'false'
        run: docker build --platform linux/arm64 --file "$DOCKERFILE" --tag "$IMAGE:scan" "$CONTEXT"
      # The same gate as CI's deploy-smoke job, and it runs before anything is pushed.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.exists.outputs.found == 'false'
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      - name: Push
        if: steps.exists.outputs.found == 'false'
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "$IMAGE:scan" "$REGISTRY/$IMAGE:$GITHUB_SHA"
          docker push "$REGISTRY/$IMAGE:$GITHUB_SHA"

  release:
    needs: images
    runs-on: ubuntu-24.04
    environment: poc
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      POC_INSTANCE_ID: ${{ vars.POC_INSTANCE_ID }}
      POC_RELEASES_BUCKET: ${{ vars.POC_RELEASES_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.POC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload the bundle
        # deploy/poc, with its path kept, so it unpacks as <release>/deploy/poc/ (host/deploy finds its files from there).
        run: |
          tar -czf "$RUNNER_TEMP/bundle.tar.gz" deploy/poc
          aws s3 cp "$RUNNER_TEMP/bundle.tar.gz" "s3://$POC_RELEASES_BUCKET/releases/$GITHUB_SHA.tar.gz"
      - name: Deploy on the server
        run: |
          # What the server runs, as root, through SSM. It is a throwaway unpack folder first, then moved into place.
          script=$(cat <<'EOS'
          set -euo pipefail
          dir=/opt/roadmap/releases/$RELEASE
          rm -rf "$dir.tmp"
          mkdir -p "$dir.tmp"
          aws s3 cp "s3://$BUCKET/releases/$RELEASE.tar.gz" "$dir.tmp.tar.gz" --region "$REGION"
          tar -xzf "$dir.tmp.tar.gz" -C "$dir.tmp"
          rm -f "$dir.tmp.tar.gz"
          rm -rf "$dir"
          mv "$dir.tmp" "$dir"
          exec "$dir/deploy/poc/host/deploy" "$RELEASE"
          EOS
          )
          parameters=$(jq -n --arg release "$GITHUB_SHA" --arg bucket "$POC_RELEASES_BUCKET" --arg region "$AWS_REGION" --arg script "$script" \
            '{executionTimeout: ["1200"], commands: ["RELEASE=\($release)\nBUCKET=\($bucket)\nREGION=\($region)\nexport RELEASE BUCKET REGION\n\($script)"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$POC_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "$parameters" \
            --query Command.CommandId --output text)
          echo "Command $command_id sent."
          # Poll every 10 seconds, for up to 20 minutes (the command's own limit is 1200 seconds).
          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            # Right after the send the invocation may not exist yet; that is not a failure.
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$POC_INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)
            echo "status: $status"
            case "$status" in
              Pending | InProgress | Delayed) ;;
              *) break ;;
            esac
          done
          result=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$POC_INSTANCE_ID" --output json)
          echo "---- output ----"
          jq -r '.StandardOutputContent' <<< "$result"
          echo "---- errors ----"
          jq -r '.StandardErrorContent' <<< "$result"
          if [[ "$status" != Success ]]; then
            echo "The deploy ended with status $status. If it rolled back, the previous release is running again." >&2
            exit 1
          fi

  check:
    needs: release
    runs-on: ubuntu-24.04
    env:
      POC_DOMAIN: ${{ vars.POC_DOMAIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: The server answers as it should
        run: scripts/post-deploy-check.sh "https://${POC_DOMAIN}"
