# The smoke run only (CI's deploy-smoke job): MinIO stands in for S3. Layer it on the stack, from the repository root:
#   docker compose -f deploy/poc/docker-compose.yml -f deploy/poc/docker-compose.smoke.yml up -d --wait
# deploy/poc/.env must also set MINIO_ROOT_USER, MINIO_ROOT_PASSWORD and MINIO_KMS_SECRET_KEY (see the end of
# api.env.example), all generated for the run. Never use this file for a real deployment.
services:
  mongo:
    # A named volume, so the run writes nothing on the host and `down -v` removes it.
    volumes: !override
      - mongo_data:/data/db
      # !override drops the base file's list, so the app-user script is mounted again here.
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

  minio:
    # MinIO's own images are no longer published; this is the community build of the same server, pinned.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER for the smoke run}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD for the smoke run}
      # A static key (its name is smoke-key), which minio-bucket makes the bucket's default encryption key, as the
      # project's KMS key is on S3. The API sends no encryption header, here or on S3.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY for the smoke run}
    volumes:
      - minio_data:/data
    # Download links name minio:9000; the smoke script reaches it here with SMOKE_CONNECT_TO.
    ports:
      - "${MINIO_PORT:-127.0.0.1:9000}:9000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the bucket with SSE-KMS by default once MinIO is up, then exits.
  minio-bucket:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set smoke http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null
        mc mb --ignore-existing "smoke/$$S3_BUCKET"
        mc encrypt set sse-kms smoke-key "smoke/$$S3_BUCKET"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  api:
    environment:
      S3_ENDPOINT: http://minio:9000
      # MinIO's root account; in production the instance role supplies credentials instead.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio-bucket:
        condition: service_completed_successfully

volumes:
  mongo_data:
  minio_data:
