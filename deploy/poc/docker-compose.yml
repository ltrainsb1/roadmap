# Run from the repository root:
#   docker compose -f deploy/poc/docker-compose.yml up -d --build
# Needs deploy/poc/.env (copy .env.example and replace the placeholders).
# Files go to S3 (S3_BUCKET) with the instance role's credentials; there is no MinIO here. The smoke run layers
# docker-compose.smoke.yml on top to add one.
#
# Services and their memory: the limit where one is set, then the peak measured on the devbox smoke run (cgroup
# memory.peak, after the smoke script plus list and timeline PDFs of a 200-item roadmap; Task 9 of the snapshots plan):
#   mongo    no limit   460 MiB
#   clamav   3g         1.5 GiB while loading its signatures; a reload briefly holds two copies (about 1.9 GiB)
#   api      no limit   230 MiB
#   pdf      1g         260 MiB (headless Chromium; at most 2 renders at once, so allow for more). The API refuses
#                       a PDF of more than 700 rows (MAX_PDF_SIZE): two of that size at once peaked at 785 MiB.
#   caddy    no limit    22 MiB
#   worker   256m        50 MiB (after the smoke script and its assignment email; notifications plan, Task 7)
# About 2.5 GiB at once, and up to 4.5 GiB if ClamAV and Chromium both reach their limits: size the POC server at
# 8 GB, not 4.

name: roadmap-poc

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    # Auth plus a replica set needs a key file. One node has no peers to share it with, so a fresh
    # random key on every start is enough (it lives on tmpfs).
    entrypoint:
      - /bin/bash
      - -c
      - |
        head -c 512 /dev/urandom | base64 -w0 > /keys/replica.key
        chown mongodb:mongodb /keys/replica.key
        chmod 400 /keys/replica.key
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/keys/replica.key", "--bind_ip_all"]
    tmpfs:
      - /keys
    volumes:
      - ${MONGO_DATA:-/srv/mongo}:/data/db
    healthcheck:
      # Runs rs.initiate once (the first time it finds no primary); healthy once this node is primary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "if (db.hello().isWritablePrimary) quit(0);
          try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } catch (e) {}
          quit(1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  clamav:
    image: clamav/clamav:1.4.7
    restart: unless-stopped
    # Signatures take about 1 GB in memory; a reload briefly holds two copies (about 1.9 GiB), so leave room above that.
    mem_limit: 3g
    volumes:
      # The signature database: kept across restarts so a restart does not download it again.
      - clamav_db:/var/lib/clamav
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/log/clamav
    # The start script runs as root: it creates /run/clamav, takes ownership of the database folder and freshclam
    # writes into it, then freshclam and clamd switch to the clamav user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image's own check (clamd answers PING on 3310), polled more often while the signatures load.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 6m
      start_interval: 5s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: roadmap-api:poc
    restart: unless-stopped
    env_file: .env
    # Production needs both (the API refuses to start otherwise), so they are fixed here, not in .env. The worker
    # loads the same configuration, so it takes the same settings (the anchor below).
    environment: &api-environment
      FILES: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in deploy/poc/.env}
      SCANNER: clamd
      CLAMD_HOST: clamav
      PDF: service
      PDF_URL: http://pdf:3200
      # How long the API waits for one PDF: above the PDF service's RENDER_TIMEOUT_MS, so the service answers first,
      # and below the 2-minute render token (the API refuses to start otherwise).
      PDF_TIMEOUT_MS: ${PDF_TIMEOUT_MS:-60000}
      # The API takes the client address from X-Forwarded-For only from a peer on proxy_api, which is Caddy alone.
      TRUSTED_PROXY_CIDR: ${PROXY_SUBNET:-10.254.254.0/24}
    depends_on:
      mongo:
        condition: service_healthy
      clamav:
        condition: service_healthy
      # Started, not healthy: PDFs are an optional export. If Chromium cannot start on a host (its sandbox refused,
      # AppArmor), sign-in and everything else still come up, and the API answers pdf_failed to a PDF request.
      pdf:
        condition: service_started
    networks:
      - default
      - proxy_api
      # The PDF service reaches the API here, like any outside client but without Caddy's limits in front, and the
      # API sees it at its own address: it cannot choose the client address the API records.
      - pdf_api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Healthy once the API has connected to MongoDB and is listening, not merely started. The image has
      # no curl or wget, so node makes the request.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Sends notification emails: instant ones, due-soon reminders and daily digests (dist/worker.js in the API image).
  # It needs only MongoDB and outbound email (SES), so it is on the default network alone, with no published port.
  # Nothing depends on it: with it stopped, the site and the API keep working and emails wait in MongoDB until it
  # is back.
  worker:
    image: roadmap-api:poc
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    # The API's settings: the worker reads the same configuration, which refuses to load without them in
    # production, even those (files, scanner, PDFs) the worker does not use.
    environment: *api-environment
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
    read_only: true
    # The heartbeat file (WORKER_HEARTBEAT_FILE, default /tmp/worker-heartbeat) and the file mailer's outbox.
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    # On SIGTERM the worker finishes the pass it is in, then exits. A pass can wait on the email service (each send may
    # take up to 30 s before it gives up), so the stop waits up to 2 minutes rather than Docker's 10 s: a kill between
    # sending an email and marking it sent would send that email again after the lease runs out.
    stop_grace_period: 120s
    healthcheck:
      # The worker touches its heartbeat file after each pass in which at least one step succeeded. Healthy while
      # that file is newer than three intervals (WORKER_INTERVAL_MS, default 30 s) plus 150 s: one pass held up by a
      # slow email service (30 s per send before it gives up) is not reported as a dead worker.
      test:
        - CMD
        - node
        - -e
        - >-
          const fs = process.getBuiltinModule('node:fs');
          const file = process.env.WORKER_HEARTBEAT_FILE || '/tmp/worker-heartbeat';
          const limit = 3 * Number(process.env.WORKER_INTERVAL_MS || 30000) + 150000;
          try { process.exit(Date.now() - fs.statSync(file).mtimeMs < limit ? 0 : 1) } catch { process.exit(1) }
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Prints snapshot pages to PDF with headless Chromium. Only the API calls it (pdf_api), and it only opens pages
  # from Caddy's internal listener (pdf_render). Both networks are internal: no route to MongoDB, ClamAV, S3/MinIO
  # or the internet. No port is published.
  pdf:
    build:
      context: ../..
      dockerfile: apps/pdf/Dockerfile
    image: roadmap-pdf:poc
    restart: unless-stopped
    environment:
      RENDER_ORIGIN: http://caddy:8080
      # The deadline for one render. The largest PDF the API allows (MAX_PDF_SIZE, 700 rows) took about 1 s on the
      # devbox, so 45 s leaves a wide margin for a slower server.
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-45000}
    networks:
      - pdf_api
      - pdf_render
    # Chromium's sandbox stays on. It needs user namespaces, which Docker's default seccomp profile refuses: this
    # is that profile plus clone, setns and unshare (Playwright's utils/docker/seccomp_profile.json, v1.65.1).
    security_opt:
      - no-new-privileges:true
      - seccomp=chromium-seccomp.json
    cap_drop: [ALL]
    # The sandbox's zygote calls chroot inside the user namespace it creates. Docker's seccomp profile, and the one
    # above, allow the chroot system call only when the container holds CAP_SYS_CHROOT: with cap_drop ALL it fails
    # with EPERM at that layer, and Chromium stops with "Check failed: sys_chroot("/proc/self/fdinfo/") == 0".
    # cap_add lifts exactly that rule. The service runs as a non-root user with no-new-privileges, so it holds no
    # capability in the container itself.
    cap_add: [SYS_CHROOT]
    read_only: true
    # Chromium writes its profile under /tmp and a little under $HOME. Playwright starts it with
    # --disable-dev-shm-usage, so shared memory goes to /tmp too and the default /dev/shm is enough.
    tmpfs:
      - /tmp
      - /home/pdf:uid=10001,gid=10001,mode=0700
    # Chromium's helper processes are reaped by an init, not by node.
    init: true
    mem_limit: 1g
    healthcheck:
      # 503 while a render is stuck; the service also exits by itself then, and restart brings it back.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3200/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    build:
      context: ../..
      dockerfile: deploy/poc/caddy.Dockerfile
    image: roadmap-caddy:poc
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    # Port 8080, the PDF service's internal listener, is deliberately not published.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # Not on default: Caddy talks only to the API, over proxy_api, so the API always sees it there.
    networks:
      proxy_api:
      # Caddy's internal listener binds to this alias only, so it answers on pdf_render and nowhere else.
      pdf_render:
        aliases: [caddy-render]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

networks:
  default:
  # Only Caddy and the API, on a fixed range the API trusts as its proxy (PROXY_SUBNET in .env to change it). Not
  # internal: Caddy's published ports need a network with a way out.
  proxy_api:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-10.254.254.0/24}
  # Only the API and the PDF service.
  pdf_api:
    internal: true
  # Only the PDF service and Caddy's internal listener.
  pdf_render:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  clamav_db:
